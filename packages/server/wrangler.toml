name = "juicebox-mcp"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# MCP (/mcp) and page WebSockets (/ws) are served on this custom domain (design §6.4).
routes = [
  { pattern = "jbmcp.3dg.io", custom_domain = true },
]
# No *.workers.dev hostname and no preview URLs: jbmcp.3dg.io is the one public
# address MCP clients and pages are given, so there is no second entry point to
# keep in sync or to leave behind when the domain moves.
workers_dev = false
preview_urls = false

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "WEBSOCKET_ROOM"
class_name = "WebSocketRoom"

[[durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "McpSession"

[[migrations]]
tag = "v1"
new_classes = ["WebSocketRoom"]

[[migrations]]
tag = "v2"
new_classes = ["McpSession"]

[vars]
# juicebox-web, the page join links and snapshot links open (not this Worker).
# The trailing slash matters: the app is served under /juicebox/ with relative assets.
# For `wrangler dev`, override it in .dev.vars (see .dev.vars.example).
BROWSER_URL = "https://aidenlab.org/juicebox/"
TINYURL_DOMAIN = "t.3dg.io"
TINYURL_ENDPOINT = "https://api.tinyurl.com/create"
# Pages that may open /ws (exact Origin match). WebSockets are not covered by CORS.
ALLOWED_ORIGINS = [
  "https://aidenlab.org",
  "http://www.aidenlab.org",
  "https://www.aidenlab.org",
  "https://juicebox.aidenlab.org",
  "https://3dg.io",
  "https://www.3dg.io",
  "https://juicebox-web.pages.dev",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
]

# Secrets (set via `wrangler secret put`, see scripts/deploy-wizard.sh; for `wrangler dev`, in .dev.vars):
# TINYURL_API_KEY      - TinyURL API token for create_shareable_url; unset → links are not shortened
# SESSION_HMAC_SECRET  - HMAC key deriving room ids from x-openai-session; unset → those requests fail

# ── Frozen demo deployment (do not redeploy) ─────────────────────────────────
# `wrangler deploy --env v2` published this code as the Worker "juicebox-mcp-v2"
# on its *.workers.dev address, paired with the Pages project juicebox-web-dev at
# https://juicebox-v2.3dg.io/. That stack is frozen at tag demo-2026-10 (here and
# in weiszd/juicebox-web) for demos; users of its connector keep working while
# development continues on [env.dev] below. A demo hotfix = check out the tag,
# deploy --env v2 once, go back. Named environments inherit the top-level
# `routes` (so `routes = []` keeps jbmcp.3dg.io on the prototype Worker) but not
# `vars` or `durable_objects`, so those are repeated; migrations are top-level
# and apply to every environment. Secrets are per environment:
# `wrangler secret put <NAME> --env <env>`.
[env.v2]
name = "juicebox-mcp-v2"
routes = []
workers_dev = true
preview_urls = false

[[env.v2.durable_objects.bindings]]
name = "WEBSOCKET_ROOM"
class_name = "WebSocketRoom"

[[env.v2.durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "McpSession"

[env.v2.vars]
# juicebox-web fork master at tag demo-2026-10, Pages project juicebox-web-dev.
BROWSER_URL = "https://juicebox-v2.3dg.io/"
TINYURL_DOMAIN = "t.3dg.io"
TINYURL_ENDPOINT = "https://api.tinyurl.com/create"
ALLOWED_ORIGINS = [
  "https://aidenlab.org",
  "http://www.aidenlab.org",
  "https://www.aidenlab.org",
  "https://juicebox.aidenlab.org",
  "https://3dg.io",
  "https://www.3dg.io",
  "https://juicebox-web.pages.dev",
  "https://juicebox-v2.3dg.io",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
]

# ── Development deployment: "Juicebot dev" ───────────────────────────────────
# Juicebot is the name of the AI-enabled juicebox; the dev stack carries a -dev
# suffix everywhere so the production release only adds the un-suffixed names:
# Worker juicebot-mcp-dev at https://juicebot-mcp-dev.3dg.io (MCP clients use
# /mcp, pages /ws), paired with the Pages project juicebot-web-dev at
# https://juicebot-dev.3dg.io/ (scripts/deploy-web-dev.sh). Wrangler creates the
# DNS record for the custom domain; the zone is on this account.
# `wrangler deploy --env dev`; secrets with `wrangler secret put <NAME> --env dev`.
[env.dev]
name = "juicebot-mcp-dev"
routes = [
  { pattern = "juicebot-mcp-dev.3dg.io", custom_domain = true },
]
workers_dev = false
preview_urls = false

[[env.dev.durable_objects.bindings]]
name = "WEBSOCKET_ROOM"
class_name = "WebSocketRoom"

[[env.dev.durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "McpSession"

[env.dev.vars]
# For a local juicebox-web dev server instead, override in .dev.vars or use
# http://localhost:5173/.
BROWSER_URL = "https://juicebot-dev.3dg.io/"
TINYURL_DOMAIN = "t.3dg.io"
TINYURL_ENDPOINT = "https://api.tinyurl.com/create"
ALLOWED_ORIGINS = [
  "https://juicebot-dev.3dg.io",
  "https://juicebot-web-dev.pages.dev",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
]
