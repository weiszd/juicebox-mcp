name = "juicebox-mcp"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# MCP (/mcp) and page WebSockets (/ws) are served on this custom domain (design §6.4).
routes = [
  { pattern = "jbmcp.3dg.io", custom_domain = true },
]
# No *.workers.dev hostname and no preview URLs: jbmcp.3dg.io is the one public
# address MCP clients and pages are given, so there is no second entry point to
# keep in sync or to leave behind when the domain moves.
workers_dev = false
preview_urls = false

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "WEBSOCKET_ROOM"
class_name = "WebSocketRoom"

[[durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "McpSession"

[[migrations]]
tag = "v1"
new_classes = ["WebSocketRoom"]

[[migrations]]
tag = "v2"
new_classes = ["McpSession"]

[vars]
# juicebox-web, the page join links and snapshot links open (not this Worker).
# The trailing slash matters: the app is served under /juicebox/ with relative assets.
# For `wrangler dev`, override it in .dev.vars (see .dev.vars.example).
BROWSER_URL = "https://aidenlab.org/juicebox/"
TINYURL_DOMAIN = "t.3dg.io"
TINYURL_ENDPOINT = "https://api.tinyurl.com/create"
# Pages that may open /ws (exact Origin match). WebSockets are not covered by CORS.
ALLOWED_ORIGINS = [
  "https://aidenlab.org",
  "http://www.aidenlab.org",
  "https://www.aidenlab.org",
  "https://juicebox.aidenlab.org",
  "https://3dg.io",
  "https://www.3dg.io",
  "https://juicebox-web.pages.dev",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
]

# Secrets (set via `wrangler secret put`, see scripts/deploy-wizard.sh; for `wrangler dev`, in .dev.vars):
# TINYURL_API_KEY      - TinyURL API token for create_shareable_url; unset → links are not shortened
# SESSION_HMAC_SECRET  - HMAC key deriving room ids from x-openai-session; unset → those requests fail

# ── Side-by-side trial deployment ────────────────────────────────────────────
# `wrangler deploy --env v2` publishes this same code as a second Worker,
# "juicebox-mcp-v2", on its *.workers.dev address, leaving the prototype Worker
# "juicebox-mcp" and jbmcp.3dg.io untouched. Named environments inherit the
# top-level `routes` (so `routes = []` here is what keeps the domain on the
# prototype) but not `vars` or `durable_objects`, so those are repeated;
# migrations are top-level and apply to every environment. Secrets are per
# environment: `wrangler secret put <NAME> --env v2`. Cutover later = move the
# custom domain route into this block.
[env.v2]
name = "juicebox-mcp-v2"
routes = []
workers_dev = true
preview_urls = false

[[env.v2.durable_objects.bindings]]
name = "WEBSOCKET_ROOM"
class_name = "WebSocketRoom"

[[env.v2.durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "McpSession"

[env.v2.vars]
# juicebox-web with the room widget, built from the fork's ticket/16 branch and
# uploaded to the Cloudflare Pages project juicebox-web-dev (scripts/deploy-web-dev.sh).
# For a local juicebox-web dev server instead, override in .dev.vars or use
# http://localhost:5173/.
BROWSER_URL = "https://juicebox-v2.3dg.io/"
TINYURL_DOMAIN = "t.3dg.io"
TINYURL_ENDPOINT = "https://api.tinyurl.com/create"
ALLOWED_ORIGINS = [
  "https://aidenlab.org",
  "http://www.aidenlab.org",
  "https://www.aidenlab.org",
  "https://juicebox.aidenlab.org",
  "https://3dg.io",
  "https://www.3dg.io",
  "https://juicebox-web.pages.dev",
  "https://juicebox-v2.3dg.io",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
]
